plugins {
    id 'java'
    id 'idea'
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

def MT_TOKEN = System.getenv("MODRINTH_TOKEN")
def CF_TOKEN = System.getenv("CURSEFORGE_TOKEN")

java {
}

base {
    archivesName = modid
    version = "$modloadershort-mc$minecraftversion-v$modversion"
}

java.toolchain {
    languageVersion = JavaLanguageVersion.of(Integer.valueOf(javaversion))
}

loom {
    mixin {
        defaultRefmapName = "${modid}.${mixin_refmap_suffix}"
    }

    accessWidenerPath = file("src/main/resources/${modid}.accesswidener")

    mods {
        "${modid}" {
            sourceSet sourceSets.main
        }
    }

}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url "https://repo.spongepowered.org/maven" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url 'https://maven.parchmentmc.org' }
    maven { url "https://www.cursemaven.com"

        content { includeGroup "curse.maven" }
    }
    maven { url 'https://jitpack.io' }
}

configurations {
    shadeLibrary
    implementation.extendsFrom shadeLibrary
}

dependencies {
    minecraft "com.mojang:minecraft:$minecraftversion"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-$minecraftversion:$mappingsversion@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:$fabricloaderversion"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabricversion"

    // DEPENDENCIES
    implementation "com.github.WaterMediaTeam:watermedia:$watermediaversion"
}

tasks.processResources.outputs.upToDateWhen { false }
processResources {
    filesMatching(['fabric.mod.json', 'pack.mcmeta', "${modid}.${mixin_file_suffix}".toString()]) {
        expand project.properties
    }

}

jar {
    manifest {
        attributes([
                "Specification-Title"       : modid,
                "Specification-Vendor"      : modauthors,
                "Specification-Version"     : version,
                "Implementation-Title"      : modname,
                "Implementation-Version"    : modversion,
                "Implementation-Vendor"     : modauthors,
                "Implementation-Timestamp"  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"              : "$modid.$mixin_file_suffix"
        ])
    }
    from {
        configurations.shadeLibrary.collect {
            it.isDirectory() ? it.matching {
                exclude '*', 'META-INF/**'
            } : zipTree(it).matching {
                exclude '*', 'META-INF/**'
            }
        }
    }
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}"}
    }
    finalizedBy(remapJar)
}

publishMods {
    file = remapJar.archiveFile
    changelog = getChangelogText()
    type = ALPHA
    displayName = "$modname/$project.properties.version"
    modLoaders.add(modloader.toLowerCase())
    maxRetries = 2

    dryRun = false

    curseforge {
        accessToken = CF_TOKEN
        projectId = curseforgeid
        minecraftVersions.addAll(minecraftversion)
        javaVersions.addAll(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = true
        projectSlug = modid
        requires("fabric-api", "watermedia")
    }

    modrinth {
        accessToken = MT_TOKEN
        projectId = modrinthid
        requires("fabric-api", "watermedia")
        minecraftVersions.addAll(minecraftversion)
    }
}

def getChangelogText() {
    def result = ""
    for (String line: file('CHANGELOG.md').readLines('UTF-8')) {
        if (line.isEmpty()) return result
        result += line + '\n'
    }
    return result
}