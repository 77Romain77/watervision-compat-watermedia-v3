plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.0.+'
    id "me.modmuss50.mod-publish-plugin" version "0.8.3"
}

def MT_TOKEN = System.getenv("MODRINTH_TOKEN")
def CF_TOKEN = System.getenv("CURSEFORGE_TOKEN")

java {
    withSourcesJar()
}

base {
    archivesName = modid
    version = "$modloadershort-mc$minecraftversion-v$modversion"
}

java.toolchain {
    languageVersion = JavaLanguageVersion.of(Integer.valueOf(javaversion))
}

println "Java: ${System.getProperty 'java.version'}, Gradle Java: ${JavaVersion.current()}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}
runs {
    configureEach {
        systemProperty  'forge.logging.console.level', 'debug'
        systemProperty  'log4j.appender.Console', "org.apache.log4j.ConsoleAppender"
        systemProperty  'terminal.jline', 'true'

        modSource sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', modid
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', modid
        programArgument '--nogui'
    }
}


configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url "https://repo.spongepowered.org/maven" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven { url 'https://jitpack.io' }
}

configurations {
    shadeLibrary
    implementation.extendsFrom shadeLibrary
}

jarJar.enable()

dependencies {
    implementation "net.neoforged:neoforge:$forgeversion"

    // DEPENDENCIES
    implementation "com.github.WaterMediaTeam:watermedia:$watermediaversion"
}

tasks.processResources.outputs.upToDateWhen { false }
processResources {
    filesMatching(['META-INF/*.toml', 'pack.mcmeta', "${modid}.${mixin_file_suffix}".toString()]) {
        expand project.properties
    }

}

jar {
    manifest {
        attributes([
                "Specification-Title"       : modid,
                "Specification-Vendor"      : modauthors,
                "Specification-Version"     : version,
                "Implementation-Title"      : modname,
                "Implementation-Version"    : modversion,
                "Implementation-Vendor"     : modauthors,
                "Implementation-Timestamp"  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"              : "$modid.$mixin_file_suffix"
        ])
    }
    from {
        configurations.shadeLibrary.collect {
            it.isDirectory() ? it.matching {
                exclude '*', 'META-INF/**'
            } : zipTree(it).matching {
                exclude '*', 'META-INF/**'
            }
        }
    }
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}"}
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

publishMods {
    file = jar.archiveFile
    changelog = getChangelogText()
    type = ALPHA
    displayName = "$modname/$project.properties.version"
    modLoaders.add(modloader.toLowerCase())
    maxRetries = 2

    dryRun = false

    curseforge {
        accessToken = CF_TOKEN
        projectId = curseforgeid
        minecraftVersions.addAll(minecraftversion)
        javaVersions.addAll(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = true
        projectSlug = modid
        requires("watermedia")
        additionalFile(sourcesJar) {
            name = "$modid-sources/${project.properties.version}"
        }
    }

    modrinth {
        accessToken = MT_TOKEN
        projectId = modrinthid
        requires("watermedia")
        minecraftVersions.addAll(minecraftversion)
    }
}

def getChangelogText() {
    def result = ""
    for (String line: file('CHANGELOG.md').readLines('UTF-8')) {
        if (line.isEmpty()) return result
        result += line + '\n'
    }
    return result
}