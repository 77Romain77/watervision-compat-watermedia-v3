name: Apply Resume Guard Fix

on:
  pull_request:
    branches:
      - 1.20.1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: watermedia-3.0.0.23-compat

      - name: Remove blocking resume guard
        run: python .github/scripts/remove_resume_wait_guard.py

      - name: Commit resume fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/me/srrapero720/watervision/client/screens/VisionScreen.java
          git commit -m 'Avoid blocking delayed resume'
          git push origin HEAD:watermedia-3.0.0.23-compat
