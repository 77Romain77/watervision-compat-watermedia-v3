name: Apply WaterMedia MRL Rename

on:
  push:
    branches:
      - watermedia-3.0.0.23-compat

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: watermedia-3.0.0.23-compat

      - name: Replace removed MediaAPI method
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/me/srrapero720/watervision/client/screens/VisionScreen.java')
          text = path.read_text(encoding='utf-8')
          old = 'MediaAPI.getMRL('
          count = text.count(old)
          if count != 4:
              raise SystemExit(f'Expected 4 getMRL calls in VisionScreen, found {count}')
          path.write_text(text.replace(old, 'MediaAPI.mrl('), encoding='utf-8')
          PY

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/me/srrapero720/watervision/client/screens/VisionScreen.java
          git commit -m 'Use WaterMedia mrl factory'
          git push origin HEAD:watermedia-3.0.0.23-compat
