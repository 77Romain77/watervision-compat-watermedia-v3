name: Inspect WaterMedia Player API

on:
  push:
    branches:
      - watermedia-3.0.0.23-compat

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download WaterMedia 3.0.0.23
        run: |
          curl --fail --location --retry 3 --output watermedia.jar \
            'https://cdn.modrinth.com/data/G922NeHS/versions/FdCZ5Rxq/watermedia-3.0.0.23.jar'

      - name: Inspect player signatures
        run: |
          javap -classpath watermedia.jar org.watermedia.api.media.players.MediaPlayer
          javap -classpath watermedia.jar org.watermedia.api.media.MRL\$Status
