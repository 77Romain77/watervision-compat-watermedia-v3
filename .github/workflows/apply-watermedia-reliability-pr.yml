name: Apply WaterMedia Reliability Patch

on:
  pull_request:
    branches:
      - 1.20.1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: watermedia-3.0.0.23-compat
          fetch-depth: 0

      - name: Apply reliability patch
        run: python .github/scripts/apply_watermedia_reliability.py

      - name: Remove temporary tooling
        run: |
          git checkout 399306adaec3f70024727766c851800399936780 -- .github/workflows/build.yml
          rm -f .github/workflows/inspect-watermedia-player.yml
          rm -f .github/workflows/apply-watermedia-reliability.yml
          rm -f .github/workflows/apply-watermedia-reliability-pr.yml
          rm -f .github/scripts/apply_watermedia_reliability.py

      - name: Commit reliability improvements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Improve WaterMedia loading recovery'
          git push origin HEAD:watermedia-3.0.0.23-compat
